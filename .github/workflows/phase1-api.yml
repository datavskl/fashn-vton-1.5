name: Phase 1 API checks

on:
  push:
    branches:
      - develop/shrivastra-vton-backend
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pillow>=10,<13" "python-multipart>=0.0.9,<1"
      - name: Compile API source
        run: python -m py_compile backend_api.py image_preprocessing.py scripts/gpu_smoke_test.py tests/test_backend_api.py tests/conftest.py
      - name: Check WordPress integration syntax
        run: php -l wordpress/shrivastra-vton-bridge/shrivastra-vton-bridge.php
      - name: Run API contract tests
        run: python -m pytest -q tests/test_backend_api.py
