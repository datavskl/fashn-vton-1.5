<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHN Virtual Try-On</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .upload-box:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-box.dragover {
            border-color: #667eea;
            background: #f0f2ff;
            transform: scale(1.02);
        }

        .upload-box input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .upload-placeholder {
            font-size: 3em;
            color: #ddd;
            margin-bottom: 15px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .control-group select,
        .control-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-top: 20px;
        }

        .result img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #c33;
        }

        .success {
            background: #efe;
            color: #393;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #393;
        }

        .job-status {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #ffc107;
        }

        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FASHN Virtual Try-On</h1>
            <p>Upload your photo and garment to see how it looks on you</p>
        </div>

        <div class="main-content">
            <form id="tryOnForm">
                <div class="upload-section">
                    <div class="upload-box" id="personUpload">
                        <input type="file" id="personImage" accept="image/*" required>
                        <div class="upload-placeholder">👤</div>
                        <h3>Person Image</h3>
                        <p>Click or drag to upload your photo</p>
                    </div>

                    <div class="upload-box" id="garmentUpload">
                        <input type="file" id="garmentImage" accept="image/*" required>
                        <div class="upload-placeholder">👕</div>
                        <h3>Garment Image</h3>
                        <p>Click or drag to upload the clothing</p>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="tops">Tops</option>
                            <option value="bottoms">Bottoms</option>
                            <option value="one-pieces">One-pieces</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="garmentPhotoType">Photo Type</label>
                        <select id="garmentPhotoType" required>
                            <option value="">Select type</option>
                            <option value="model">Model</option>
                            <option value="flat-lay">Flat-lay</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="numTimesteps">Sampling Steps</label>
                        <input type="number" id="numTimesteps" min="10" max="50" value="50">
                    </div>

                    <div class="control-group">
                        <label for="guidanceScale">Guidance Scale</label>
                        <input type="number" id="guidanceScale" min="1.0" max="3.0" step="0.1" value="1.5">
                    </div>

                    <div class="control-group">
                        <label for="seed">Seed</label>
                        <input type="number" id="seed" min="0" value="42">
                    </div>

                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="segmentationFree" checked>
                            Segmentation Free
                        </label>
                    </div>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn btn-primary" id="syncBtn">
                        Try On (Sync)
                    </button>
                    <button type="button" class="btn btn-secondary" id="asyncBtn">
                        Try On (Async)
                    </button>
                </div>
            </form>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Processing your try-on request...</p>
            </div>

            <div id="jobStatus" style="display: none;"></div>
            <div id="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentJobId = null;
        let pollInterval = null;

        // File upload handling
        function setupFileUpload(uploadBoxId, inputId) {
            const uploadBox = document.getElementById(uploadBoxId);
            const input = document.getElementById(inputId);

            uploadBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadBox.classList.add('dragover');
            });

            uploadBox.addEventListener('dragleave', () => {
                uploadBox.classList.remove('dragover');
            });

            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    input.files = files;
                    displayPreview(uploadBox, files[0]);
                }
            });

            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    displayPreview(uploadBox, e.target.files[0]);
                }
            });
        }

        function displayPreview(uploadBox, file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const existingImg = uploadBox.querySelector('img');
                if (existingImg) {
                    existingImg.remove();
                }

                const img = document.createElement('img');
                img.src = e.target.result;
                uploadBox.insertBefore(img, uploadBox.firstChild);
                
                uploadBox.querySelector('.upload-placeholder').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function showMessage(message, type = 'error') {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="${type}">${message}</div>`;
        }

        function showLoading(show = true) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('syncBtn').disabled = show;
            document.getElementById('asyncBtn').disabled = show;
        }

        async function submitSync(formData) {
            try {
                showLoading(true);
                const response = await fetch(`${API_BASE}/api/v1/try-on/sync`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Request failed');
                }

                if (data.status === 'success') {
                    const resultDiv = document.getElementById('result');
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <div class="success">Try-on completed successfully!</div>
                        <img src="data:image/png;base64,${data.result_image}" alt="Try-on result">
                    `;
                } else {
                    showMessage('Unexpected response format', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function submitAsync(formData) {
            try {
                showLoading(true);
                const response = await fetch(`${API_BASE}/api/v1/try-on`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Request failed');
                }

                currentJobId = data.job_id;
                showMessage(`Job created: ${currentJobId}. Polling for results...`, 'success');
                
                // Start polling
                pollJobStatus();
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function pollJobStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`${API_BASE}/api/v1/jobs/${currentJobId}`);
                const job = await response.json();

                const statusDiv = document.getElementById('jobStatus');
                statusDiv.style.display = 'block';

                if (job.status === 'pending') {
                    statusDiv.innerHTML = '<div class="job-status">⏳ Job is pending...</div>';
                } else if (job.status === 'processing') {
                    const progress = job.progress || 0;
                    statusDiv.innerHTML = `<div class="job-status">🔄 Processing... ${progress}%</div>`;
                } else if (job.status === 'completed') {
                    statusDiv.innerHTML = '<div class="success">✅ Completed! Loading result...</div>';
                    
                    // Load result image
                    const resultDiv = document.getElementById('result');
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <div class="success">Try-on completed successfully!</div>
                        <img src="${API_BASE}${job.result_url}" alt="Try-on result">
                    `;
                    
                    clearInterval(pollInterval);
                    currentJobId = null;
                } else if (job.status === 'failed') {
                    statusDiv.innerHTML = `<div class="error">❌ Failed: ${job.error || 'Unknown error'}</div>`;
                    clearInterval(pollInterval);
                    currentJobId = null;
                }

                if (job.status === 'pending' || job.status === 'processing') {
                    pollInterval = setTimeout(pollJobStatus, 2000);
                }
            } catch (error) {
                showMessage(`Error checking job status: ${error.message}`, 'error');
                clearInterval(pollInterval);
                currentJobId = null;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupFileUpload('personUpload', 'personImage');
            setupFileUpload('garmentUpload', 'garmentImage');

            // Form submission (sync)
            document.getElementById('tryOnForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const formData = new FormData();
                formData.append('person_image', document.getElementById('personImage').files[0]);
                formData.append('garment_image', document.getElementById('garmentImage').files[0]);
                formData.append('category', document.getElementById('category').value);
                formData.append('garment_photo_type', document.getElementById('garmentPhotoType').value);
                formData.append('num_timesteps', document.getElementById('numTimesteps').value);
                formData.append('guidance_scale', document.getElementById('guidanceScale').value);
                formData.append('seed', document.getElementById('seed').value);
                formData.append('segmentation_free', document.getElementById('segmentationFree').checked);

                submitSync(formData);
            });

            // Async button
            document.getElementById('asyncBtn').addEventListener('click', () => {
                const form = document.getElementById('tryOnForm');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const formData = new FormData();
                formData.append('person_image', document.getElementById('personImage').files[0]);
                formData.append('garment_image', document.getElementById('garmentImage').files[0]);
                formData.append('category', document.getElementById('category').value);
                formData.append('garment_photo_type', document.getElementById('garmentPhotoType').value);
                formData.append('num_timesteps', document.getElementById('numTimesteps').value);
                formData.append('guidance_scale', document.getElementById('guidanceScale').value);
                formData.append('seed', document.getElementById('seed').value);
                formData.append('segmentation_free', document.getElementById('segmentationFree').checked);

                submitAsync(formData);
            });
        });
    </script>
</body>
</html>
